# allow reload of this file with PRE r
bind r source-file ~/.tmux.conf \; display "Reloaded."

# switch prefix to control-a, unmap b, allow double-a to go through
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# -r repeat time (Default 500 millis)
set -g repeat-time 2000

# colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# mouse mode (scrolling, etc)
setw -g mouse on

# remove delay
set -sg escape-time 1

# set {window,pane} index to start at 1
set -g base-index 1
setw -g pane-base-index 1

# project switching
bind-key -r p run-shell "tmux neww ~/bin/.local/scripts/project"

# Set easier window split keys
bind-key v split-window -h  -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"
bind-key + split-window -h -p 20 -c "#{pane_current_path}"
bind-key = split-window -v -p 20 -c "#{pane_current_path}"
bind-key c-h select-pane -L 
bind-key c-l select-pane -R 
bind-key c-k select-pane -U 
bind-key c-j select-pane -D

# Another zoom keybind
bind-key c-\\ resize-pane -Z

# vim style through windows (PRE Control-H/L)
# bind -r C-h select-window -t :-
# bind -r C-l select-window -t :+

# vim style through resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim style movement (PRE [ then hjkl)
set-window-option -g mode-keys vi

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# k Status
set-option -g status-position top
# set-option -g automatic-rename off

# Theme
set -g status-style bg=color8,fg=color7
set -g message-style bg=color8,fg=color7
set -g message-command-style bg=color8,fg=color7
# setw -g clock-mode-color green
# set -g mode-style bg=blue,fg=colour7
# set -g window-style 'bg=color237'
# set -g window-active-style 'bg=terminal'

# set-option -g status-right-length 100
# set-option -g status-left-length 100
# set -g status-left " #{?pane_synchronized, ¤ ,}#{?window_zoomed_flag, ↕ ,}[#S-#{window_active_clients}] "
# set -g status-right "#(cd #{pane_current_path}; git branch --show-current) #H "
# set -g pane-border-style fg=color8,bg=color237
# set -g pane-active-border-style fg=color9,bg=color237
# set-window-option -g window-active-style bg=terminal
# set-window-option -g window-style bg=color237

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
